[workspace]
resolver = "2"
members = [
    "crates/yggdrasil-core",
    "crates/yggdrasil-project",
    "crates/yggdrasil-inference",
    "crates/yggdrasil-agents",
    "crates/yggdrasil-terminal",
    "crates/yggdrasil-orchestrator",
    "crates/yggdrasil-gui",
]
default-members = ["crates/yggdrasil-gui"]

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"
futures = "0.3"
eventsource-stream = "0.2"
ropey = "1.6"
ignore = "0.4"
rfd = "0.15"
portable-pty = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
yggdrasil-core = { path = "crates/yggdrasil-core" }
yggdrasil-project = { path = "crates/yggdrasil-project" }
yggdrasil-inference = { path = "crates/yggdrasil-inference" }
yggdrasil-agents = { path = "crates/yggdrasil-agents" }
yggdrasil-terminal = { path = "crates/yggdrasil-terminal" }
yggdrasil-orchestrator = { path = "crates/yggdrasil-orchestrator" }
