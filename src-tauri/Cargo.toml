[package]
name = "yggdrasil-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
rfd = "0.15"
ignore = "0.4"
chrono = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }
